name: Build Samsung A04e Kernel (pmbootstrap Downstream + AOSP Clang)

on:
  workflow_dispatch:

jobs:
  build-samsung-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Build Environment and Host Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev gcc g++ clang python3 libncurses5-dev ccache make git wget xz-utils device-tree-compiler libfdt-dev python3-pip sudo openssl

      - name: Install and Setup postmarketOS pmbootstrap Engine
        run: |
          # Clean clone from official GitLab source URL
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          sudo ln -s "$PWD/pmbootstrap/pmbootstrap.py" /usr/local/bin/pmbootstrap
          
          # Map everything safely inside the runner workspace directory context
          mkdir -p ${{ github.workspace }}/pmb_work/cache_git
          mkdir -p ${{ github.workspace }}/pmb_work/cache_pkgs
          mkdir -p ${{ github.workspace }}/pmb_work/chroots
          
          # CRITICAL FIXED FILE POSITION: Must be a dotfile .version inside the work root folder
          echo "8" > ${{ github.workspace }}/pmb_work/.version
          
          # Explicit clone from the official pmaports GitLab address
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmaports.git ${{ github.workspace }}/pmb_work/cache_git/pmaports
          
          # INJECT CODENAME DATA NATIVELY: Inject into standard community target paths layout
          mkdir -p ${{ github.workspace }}/pmb_work/cache_git/pmaports/device/community/device-samsung-a04e
          mkdir -p ${{ github.workspace }}/pmb_work/cache_git/pmaports/device/community/linux-samsung-a04e
          
          # Copy your custom APKBUILD files to the correct target mapping location
          cp -r ${{ github.workspace }}/device/linux-samsung-a04e/* ${{ github.workspace }}/pmb_work/cache_git/pmaports/device/community/linux-samsung-a04e/
          
          # Generate a valid clean deviceinfo profile file so the compilation parsing checks succeed
          cat << 'DEV' > ${{ github.workspace }}/pmb_work/cache_git/pmaports/device/community/device-samsung-a04e/deviceinfo
          deviceinfo_format_version="0"
          deviceinfo_name="Samsung Galaxy A04e"
          deviceinfo_manufacturer="Samsung"
          deviceinfo_arch="aarch64"
          DEV

          # Inject dummy placeholder APKBUILD for the device port wrapper
          cat << 'APK' > ${{ github.workspace }}/pmb_work/cache_git/pmaports/device/community/device-samsung-a04e/APKBUILD
          pkgname=device-samsung-a04e
          pkgver=1
          pkgrel=0
          pkgdesc="Samsung Galaxy A04e device package wrapper"
          arch="aarch64"
          url="https://github.com"
          license="MIT"
          depends="linux-samsung-a04e"
          package() { mkdir -p "$pkgdir"; }
          APK

          # Pre-generate modern layout configuration file matching the exact paths structure
          mkdir -p ~/.config/pmbootstrap
          cat << 'CFG' > ~/.config/pmbootstrap/config
          [pmbootstrap]
          aports = ${{ github.workspace }}/pmb_work/cache_git/pmaports
          version = 3
          work = ${{ github.workspace }}/pmb_work
          work_version = 8
          config_channels_version = 4
          device = samsung-a04e
          extra_space = 0
          is_default_channel_set = True
          jobs = 4
          kernel = downstream
          keymap = us
          mirror_alpine = http://alpinelinux.org
          mirrors_postmarketos = http://postmarketos.org
          provider = none
          timezone = UTC
          ui = none
          user = pmos
          channel = edge
          CFG
           
      - name: Create Toolchain Infrastructure Directories
        run: |
          mkdir -p toolchain/gcc
          mkdir -p toolchain/clang

      - name: Download GCC 4.9 toolchain
        run: |
          cd toolchain/gcc
          wget https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O gcc.tar.xf
          tar -xf gcc.tar.xf -C ./

      - name: Download Clang r383902
        run: |
          cd toolchain/clang
          wget https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r383902.tar.gz -O clang.tar.gz
          mkdir -p host/linux-x86/clang-r383902
          tar -xzf clang.tar.gz -C host/linux-x86/clang-r383902

      - name: Compile Downstream Kernel via pmbootstrap Engine
        run: |
          # Map execution variables to your exact toolchain extraction directories
          export CLANG_BIN=${{ github.workspace }}/toolchain/clang/host/linux-x86/clang-r383902/bin
          export GCC_BIN=${{ github.workspace }}/toolchain/gcc/arm-gnu-toolchain-14.2.rel1-x86_64_aarch64-none-linux-gnu/bin
          export PATH="${CLANG_BIN}:${GCC_BIN}:${PATH}"
          
          # Use native --as-root parameter option instead of the global system 'sudo' block
          pmbootstrap --as-root -c ~/.config/pmbootstrap/config checksum linux-samsung-a04e
          pmbootstrap --as-root -c ~/.config/pmbootstrap/config build linux-samsung-a04e --src=${{ github.workspace }} --force

      - name: Upload Compiled .apk Kernel Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: postmarketOS-Samsung-A04e-Hybrid-APK
          path: /root/.local/var/pmbootstrap/chroots/native/home/pmos/packages/aarch64/linux-samsung-a04e-*.apk
