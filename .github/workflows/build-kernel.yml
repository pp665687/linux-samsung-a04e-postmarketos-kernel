name: Build Samsung A04e Kernel (pmbootstrap Downstream + AOSP Clang)

on:
  workflow_dispatch:

jobs:
  build-samsung-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Build Environment and Host Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev gcc g++ clang python3 libncurses5-dev ccache make git wget xz-utils device-tree-compiler libfdt-dev python3-pip sudo openssl

      - name: Install and Setup postmarketOS pmbootstrap Engine
        run: |
          # Clean clone from official GitLab source URL
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          sudo ln -s "$PWD/pmbootstrap/pmbootstrap.py" /usr/local/bin/pmbootstrap
          
          # Initialize pmbootstrap silently as root without crashing the runner script
           pmbootstrap init --config-channel=edge --config-ui=none --provider=none
           
      - name: Create Toolchain Infrastructure Directories
        run: |
          mkdir -p toolchain/gcc
          mkdir -p toolchain/clang

      - name: Download GCC 4.9 toolchain
        run: |
          cd toolchain/gcc
          wget https://github.com -O gcc.tar.xf
          tar -xf gcc.tar.xf -C ./

      - name: Download Clang r383902
        run: |
          cd toolchain/clang
          wget https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r383902.tar.gz -O clang.tar.gz
          mkdir -p host/linux-x86/clang-r383902
          tar -xzf clang.tar.gz -C host/linux-x86/clang-r383902

      - name: Compile Downstream Kernel via pmbootstrap Engine
        run: |
          # Map execution variables to your exact toolchain extraction directories [ravindu644]
          export CLANG_BIN=${{ github.workspace }}/toolchain/clang/host/linux-x86/clang-r383902/bin
          export GCC_BIN=${{ github.workspace }}/toolchain/gcc/arm-gnu-toolchain-14.2.rel1-x86_64_aarch64-none-linux-gnu/bin
          export PATH="${CLANG_BIN}:${GCC_BIN}:${PATH}"
          
          # Inject package files straight into the downstream category tree
          mkdir -p /root/.local/var/pmbootstrap/cache_git/pmaports/device/downstream/
          cp -r ${{ github.workspace }}/device/linux-samsung-a04e /root/.local/var/pmbootstrap/cache_git/pmaports/device/downstream/
          
          # Force pmbootstrap to digest signature hashes and execute
          pmbootstrap --as-root checksum linux-samsung-a04e
          pmbootstrap --as-root build linux-samsung-a04e --src=${{ github.workspace }} --force

      - name: Upload Compiled .apk Kernel Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: postmarketOS-Samsung-A04e-Hybrid-APK
          path: /root/.local/var/pmbootstrap/chroots/native/home/pmos/packages/aarch64/linux-samsung-a04e-*.apk
