version: 2.1

jobs:
  build-samsung-kernel:
    docker:
      # Stable Ubuntu base image mimicking ubuntu-latest
      - image: cimg/base:stable
    steps:
      - checkout

      - run:
          name: Setup Build Environment and Host Tools
          command: |
            sudo apt-get update
            sudo apt-get install -y bc bison flex libssl-dev gcc g++ clang python3 libncurses5-dev ccache make git wget xz-utils device-tree-compiler libfdt-dev python3-pip sudo openssl

      - run:
          name: Install and Setup postmarketOS pmbootstrap Engine
          command: |
            # Clean clone from official GitLab source URL
            git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
            sudo ln -s "$PWD/pmbootstrap/pmbootstrap.py" /usr/local/bin/pmbootstrap
            
            # Map everything safely inside the CircleCI working directory context
            mkdir -p /home/circleci/project/pmb_work/cache_git
            mkdir -p /home/circleci/project/pmb_work/cache_pkgs
            mkdir -p /home/circleci/project/pmb_work/chroots
            mkdir -p /home/circleci/project/pmb_work
            
            # CRITICAL FILE MARKER FIX
            echo "8" > /home/circleci/project/pmb_work/version
            echo "8" > /home/circleci/project/pmb_work/.version
            
            # Explicit clone from the official pmaports GitLab address
            git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmaports.git /home/circleci/project/pmb_work/cache_git_v8/pmaports
            
            # Pre-generate modern layout configuration file matching the exact paths structure
            mkdir -p ~/.config/pmbootstrap
            cat << 'CFG' > ~/.config/pmbootstrap/config
            [pmbootstrap]
            aports = /home/circleci/project/pmb_work/cache_git_v8/pmaports
            version = 3
            work = /home/circleci/project/pmb_work
            work_version = 8
            config_channels_version = 4
            device = samsung-a04e
            extra_space = 0
            is_default_channel_set = True
            jobs = 4
            kernel = downstream
            keymap = us
            mirror_alpine = http://alpinelinux.org
            mirrors_postmarketos = http://postmarketos.org
            provider = none
            timezone = UTC
            ui = none
            user = pmos
            channel = edge
            CFG
            
            # Force migration command
            pmbootstrap --as-root -c ~/.config/pmbootstrap/config work_migrate

      - run:
          name: Create Toolchain Infrastructure Directories
          command: |
            mkdir -p toolchain/gcc
            mkdir -p toolchain/clang

      - run:
          name: Download GCC 4.9 toolchain
          command: |
            cd toolchain/gcc
            # Fixed typo in original workflow (tar.xf -> tar.xz)
            wget https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O gcc.tar.xz
            tar -xf gcc.tar.xz -C ./

      - run:
          name: Download Clang r383902
          command: |
            cd toolchain/clang
            wget https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r383902.tar.gz -O clang.tar.gz
            mkdir -p host/linux-x86/clang-r383902
            tar -xzf clang.tar.gz -C host/linux-x86/clang-r383902

      - run:
          name: Compile Downstream Kernel via pmbootstrap Engine
          command: |
            # Map execution variables to your exact toolchain extraction directories
            export CLANG_BIN=/home/circleci/project/toolchain/clang/host/linux-x86/clang-r383902/bin
            export GCC_BIN=/home/circleci/project/toolchain/gcc/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin
            export PATH="${CLANG_BIN}:${GCC_BIN}:${PATH}"
            
            # Inject package files straight into the newly auto-generated downstream tree path layout
            mkdir -p /home/circleci/project/pmb_work/cache_git_v8/pmaports/device/downstream/linux-samsung-a04e
            mkdir -p /home/circleci/project/pmb_work/cache_git_v8/pmaports/device/downstream/device-samsung-a04e
            
            # Copy your custom APKBUILD files to the correct target mapping location
            cp -r /home/circleci/project/device/linux-samsung-a04e/* /home/circleci/project/pmb_work/cache_git_v8/pmaports/device/downstream/linux-samsung-a04e/
            
            # CRITICAL CODENAME FIX: Write a valid deviceinfo profile file containing the required keys
            cat << 'DEV' > /home/circleci/project/pmb_work/cache_git_v8/pmaports/device/downstream/device-samsung-a04e/deviceinfo
            deviceinfo_format_version="0"
            deviceinfo_name="Samsung Galaxy A04e"
            deviceinfo_manufacturer="Samsung"
            deviceinfo_codename="samsung-a04e"
            deviceinfo_arch="aarch64"
            DEV

            # Inject dummy wrapper APKBUILD file so package indexing passes safely
            cat << 'APK' > /home/circleci/project/pmb_work/cache_git_v8/pmaports/device/downstream/device-samsung-a04e/APKBUILD
            pkgname=device-samsung-a04e
            pkgver=1
            pkgrel=0
            pkgdesc="Samsung Galaxy A04e device package wrapper"
            arch="aarch64"
            url="https://github.com"
            license="MIT"
            depends="linux-samsung-a04e"
            package() { mkdir -p "$pkgdir"; }
            APK

            # 1. FIXED CHECKSUM: Run checksum generations
            pmbootstrap --as-root -c ~/.config/pmbootstrap/config checksum linux-samsung-a04e

            # 2. RUN BUILD: Compile strictly as a package
            if ! pmbootstrap --as-root -c ~/.config/pmbootstrap/config build --packages linux-samsung-a04e --force; then
              echo "=========================================================="
              echo "❌ BUILD FAILED: Dumping pmbootstrap log.txt below..."
              echo "=========================================================="
              sudo cat /home/circleci/project/pmb_work/log.txt
              exit 1
            fi

      - run:
          name: Stage Artifacts and Fix Permissions
          command: |
            mkdir -p /home/circleci/project/output_packages
            sudo find /home/circleci/project/pmb_work/packages/ -name "linux-samsung-a04e-*.apk" -exec cp {} /home/circleci/project/output_packages/ \;
            sudo chown -R circleci:circleci /home/circleci/project/output_packages

      - store_artifacts:
          path: /home/circleci/project/output_packages

workflows:
  version: 2
  build-kernel-workflow:
    jobs:
      - build-samsung-kernel
